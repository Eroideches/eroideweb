name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Installa platform e build-tools richiesti
        run: yes | sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle (con cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Test unitari
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build APK debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Riepilogo
        if: always()
        run: |
          echo "### APK debug" >> "$GITHUB_STEP_SUMMARY"
          ls -l app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifact APK
        uses: actions/upload-artifact@v7
        with:
          name: eroideweb-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload report dei test (se falliscono)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
